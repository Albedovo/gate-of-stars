<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星门 · 星象师 / Gate of Stars · Stargazer</title>
<style>
  :root { --ink: #06060e; --navy: #0c1658; --blue: #1b3380; --sky: #4a7db0; --cream: #e8dfc7; --peach: #d9bd8a; --yellow: #eeb23a; --orange: #dc6b2c; --pink: #d397a9; --paper: #c9bea1; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--cream); font-family: "PingFang SC", Futura, "Avenir Next", "Noto Sans SC", sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  body { display: flex; flex-direction: column; }
  .pill { border: 2.5px solid var(--cream); background: transparent; color: var(--cream); border-radius: 18px; padding: 3px 12px; font-size: 12px; font-weight: 800; }
  .btn { padding: 11px 26px; border-radius: 28px; border: 3.5px solid var(--ink); background: var(--orange); color: var(--ink); font-weight: 800; font-size: 16px; box-shadow: 0 4px 0 #0006; }
  .btn.ghost { background: transparent; border-color: var(--navy); color: var(--navy); box-shadow: none; padding: 7px 18px; font-size: 13px; }
  .btn:disabled { opacity: .5; }

  #top { flex: none; height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: #0a0a13; border-bottom: 3px solid #14258f; z-index: 5; }
  #top h1 { margin: 0; font-size: 16px; letter-spacing: .2em; white-space: nowrap; }
  #dawn { flex: 1; display: flex; align-items: center; gap: 14px; max-width: 620px; margin: 0 auto; }
  #dawn small { font-size: 11px; color: var(--peach); font-weight: 700; white-space: nowrap; } #tm { font-size: 22px; font-weight: 900; min-width: 64px; }
  #track { position: relative; flex: 1; height: 5px; border-radius: 3px; background: #f5eedd44; } #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); border-radius: 3px; } #sun { position: absolute; top: -10px; width: 24px; height: 24px; margin-left: -12px; }
  #dots i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--peach); margin-right: 6px; } #dots i.on { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 12px var(--orange); }
  #conn { width: 9px; height: 9px; border-radius: 50%; background: #c33; display: inline-block; } #conn.on { background: #3c9; }

  #compass { flex: none; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #0e1030; border-bottom: 2px solid #1b2a8a; z-index: 5; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 4px 12px 4px 5px; border-radius: 20px; border: 2.5px solid #f5eedd55; background: transparent; color: var(--cream); font-size: 13px; font-weight: 700; }
  .chip i { width: 24px; height: 24px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 900; background: var(--cream); color: var(--ink); transform: rotate(45deg); border-radius: 4px; } .chip i b { transform: rotate(-45deg); }
  .chip.here { border-color: var(--cream); background: #f5eedd22; } .chip.act { border-color: var(--yellow); animation: chipPulse 1.3s infinite; } .chip.done i { background: var(--yellow); } .chip.lock { opacity: .45; }
  @keyframes chipPulse { 50% { box-shadow: 0 0 0 6px #f3bd4633; } }

  #pano { position: relative; flex: 1; min-height: 380px; overflow: hidden; background: #0a0a1c; cursor: grab; touch-action: none; user-select: none; }
  #pano.drag { cursor: grabbing; }
  .layer { position: absolute; left: 0; bottom: 0; will-change: transform; pointer-events: none; } .layer svg { display: block; } #L2 { pointer-events: auto; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, #0000 42%, #06060ed0 100%), linear-gradient(#06060e88, #06060e20 38%, #06060e90); z-index: 3; }
  #rail { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; width: 100%; z-index: 4; pointer-events: none; }
  #azim { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; font-size: 12px; font-weight: 800; letter-spacing: .15em; color: var(--ink); pointer-events: none; }
  #hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--ink); border: 3px solid var(--cream); border-radius: 22px; padding: 7px 20px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  #hint b { color: var(--yellow); }
  .edge { position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; display: none; align-items: center; gap: 8px; padding: 10px 16px; background: var(--ink); border: 3px solid var(--yellow); border-radius: 24px; font-weight: 800; cursor: pointer; animation: chipPulse 1.3s infinite; } #arrL { left: 14px; } #arrR { right: 14px; }
  #toast { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%) translateY(8px); z-index: 12; background: var(--ink); border: 3px solid var(--cream); border-radius: 22px; padding: 9px 20px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; } #toast.on { opacity: 1; transform: translateX(-50%); }
  .feed { margin-top: 10px; font-size: 13px; font-weight: 700; line-height: 1.7; color: var(--navy); } .feed div { border-left: 4px solid var(--orange); padding-left: 8px; margin: 3px 0; }
  .scroll { background: #bcae86; border: 4px solid var(--ink); border-radius: 14px; padding: 12px 16px; width: 440px; max-width: 100%; box-shadow: inset 0 0 22px #8a6a3a55; } .scroll .row { display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-bottom: 2px dashed #8a6a3a66; font-weight: 800; font-size: 15px; } .scroll .row:last-child { border: 0; } .scroll .row.cur { background: #f3bd4655; border-radius: 10px; } .scroll .row.done { opacity: .45; text-decoration: line-through; }
  .pill.off { opacity: .4; text-decoration: line-through; }
  .st .halo { opacity: 0; transition: opacity .8s; } .st.on .halo { opacity: 1; } .st .here { opacity: 0; } .st.at .here { opacity: 1; animation: gl 1.6s infinite; }
  .chip small { display: block; font-size: 10px; color: var(--peach); font-weight: 600; line-height: 1.1; }
  .st .glow { opacity: 0; } .st.on .glow { opacity: 1; animation: gl 1.3s infinite; } .st .badge { opacity: 0; } .st.done .badge { opacity: 1; } .st.locked { opacity: .4; }
  @keyframes gl { 50% { opacity: .25; } }
  #pano.storm::after, body.alarming::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; background: radial-gradient(circle, #0000 45%, #ef4a2acc 100%); animation: gl 1s infinite; }
  body.shake #pano { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  #foot { flex: none; height: 74px; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: #0a0a13; border-top: 3px solid #14258f; z-index: 5; }
  #loc { display: flex; align-items: center; gap: 10px; min-width: 210px; font-size: 13px; font-weight: 700; } #loc small { display: block; color: var(--peach); font-size: 11px; }
  #notes { flex: 1; font-size: 13px; line-height: 1.5; color: var(--peach); font-weight: 600; overflow: hidden; max-height: 58px; } #notes div { white-space: nowrap; text-overflow: ellipsis; overflow: hidden; } #notes div:first-child { color: var(--cream); }

  /* 特写视图 */
  #focus { position: absolute; inset: 0; z-index: 8; background: #0a0a13e0; display: grid; place-items: center; padding: 18px; overflow: auto; }
  #focus[hidden] { display: none; }
  .fcard { position: relative; width: 100%; max-width: 940px; max-height: 100%; overflow: auto; background-color: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 24px; padding: 18px 24px 22px;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .2 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
  .fhead { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; } .fhead h2 { margin: 0; font-size: 28px; color: var(--navy); font-weight: 900; } .fhead .en { font-size: 11px; letter-spacing: 4px; font-weight: 700; }
  .fhead .back { margin-left: auto; } .fbody { display: flex; gap: 26px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .side { flex: 1; min-width: 240px; max-width: 320px; font-size: 14px; font-weight: 600; line-height: 1.7; } .side .big { font-size: 22px; font-weight: 900; color: var(--navy); }
  .rrow { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-weight: 800; font-size: 15px; } .rrow span { flex: 1; } .rrow button { width: 48px; padding: 7px 0; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink); font-weight: 900; }
  .msg { font-size: 13px; line-height: 1.7; font-weight: 600; }
  .lamp { padding: 14px 8px; border-radius: 18px; border: 3.5px solid var(--ink); background: var(--ink); color: var(--cream); font-weight: 800; font-size: 16px; box-shadow: 0 4px 0 #0005; min-width: 120px; }
  .lamp.on { background: var(--yellow); color: var(--ink); box-shadow: 0 0 20px var(--yellow); }
  .scanbox { position: relative; width: 440px; max-width: 100%; aspect-ratio: 4/3; background: #000; border: 5px solid var(--ink); border-radius: 18px; overflow: hidden; } .scanbox video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .reticle { position: absolute; inset: 20%; border: 3px solid #6fd08acc; border-radius: 12px; pointer-events: none; }
  .tab { display: inline-block; margin: 0 4px 8px 0; padding: 4px 12px; border-radius: 16px; border: 2.5px solid var(--navy); color: var(--navy); font-size: 13px; font-weight: 800; cursor: pointer; } .tab.on { background: var(--navy); color: var(--cream); }
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: #0a0a13e6; } .modal[hidden] { display: none; }
  #lobby, #end { background: var(--ink); padding: 0 0 26px; place-items: end center; } #lobby svg, #end svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .center { position: relative; z-index: 2; text-align: center; padding: 0 20px; } .center .stat { font-size: 13px; font-weight: 700; margin-top: 14px; color: var(--ink); } .center .stat i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #c33; } .center .stat i.on { background: #2f9e5f; }
  .dev { margin-top: 10px; font-size: 12px; }
</style>
</head>
<body>
<div id="top"><h1 id="ttl"></h1><div id="dawn"><div><small id="tmL"></small><div id="tm">08:00</div></div><div id="track"><div id="fill"></div><svg id="sun" viewBox="-12 -12 24 24"></svg></div></div><div id="dots"></div><span><span id="conn"></span> <button class="pill" id="mus">♪</button> <button class="pill" id="lang"></button></span></div>
<div id="compass"></div>
<div id="pano">
  <div class="layer" id="L0"></div><div class="layer" id="L1"></div><div class="layer" id="L2"></div>
  <div id="vig"></div><svg id="rail" viewBox="0 0 1600 64" preserveAspectRatio="none"></svg><div id="azim"></div><div id="hint"></div><div class="edge" id="arrL"></div><div class="edge" id="arrR"></div><div id="toast"></div>
  <div id="focus" hidden></div>
</div>
<div id="foot"><div id="loc"></div><div id="notes"></div><button class="pill" id="bookBtn"></button></div>
<div class="modal" id="book" hidden></div>
<div class="modal" id="lobby"></div>
<div class="modal" id="end" hidden></div>

<script src="net.js"></script>
<script src="kit.js"></script>
<script>if (/[?&]demo\b/.test(location.search) || /github\.io$/.test(location.hostname)) document.write('<script src="demo.js"><\/script>');</script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const K = KIT, C = K.C, N = K.N, params = new URLSearchParams(location.search);
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const SW = 1800, XK = k => 150 + 300 * k;
let cfg, S = null;
const ui = { x: 0, v: 0, goal: null, drag: null, moved: false, focus: null, tab: 0, lastStage: -1, lastAlarm: 0, lastPhase: '', cam: false, scanning: false, cool: 0, introEl: null, fsig: null, seenT: null, chanting: false, cb: null, tt: null, knob: { a: .5, b: .5 }, holding: false, dragKnob: null, lastKnobSend: 0, hb: null };
const LOCN = () => ({ hall: L('星门厅', 'Gate hall'), gallery: L('星座廊', 'Gallery'), mirror: L('镜厅', 'Mirror Hall'), moon: L('月室', 'Moon Chamber'), star: L('星门中心', 'At the Gate'), orders: L('星令殿', 'Order Hall'), altar: L('祭坛', 'Altar') });

// ======================= 全景：三层视差 =======================
function skyContent() { K.reseed(5); return `${K.harlequin(600, 560, 150, '#05050d', '#0a1245')}${K.scatter(30, 600, 400, [C.cream, C.yellow, C.peach], 1.4, 3.6)}${K.scatter(8, 600, 380, [C.cream, C.yellow], 6, 12, 'star')}${K.wisp(30, 380, .9, .55, C.cream, .16)}`; }
function midContent() {
  K.reseed(9);
  const planet = (x, y, r, c1, c2, ring) => `<g>${ring ? `<ellipse cx="${x}" cy="${y}" rx="${r * 1.7}" ry="${r * .3}" fill="none" stroke="${C.cream}" stroke-width="6" transform="rotate(-18 ${x} ${y})"/>` : ''}<circle cx="${x}" cy="${y}" r="${r}" fill="${c1}"/><path d="M${x - r} ${y - r * .2}Q${x} ${y - r * .55} ${x + r} ${y - r * .2}" fill="none" stroke="${c2}" stroke-width="${r * .2}" opacity=".9"/><path d="M${x - r * .9} ${y + r * .35}Q${x} ${y + r * .05} ${x + r * .9} ${y + r * .35}" fill="none" stroke="${c2}" stroke-width="${r * .12}" opacity=".8"/>${ring ? `<path d="M${x - r * 1.7} ${y + r * .1}Q${x} ${y + r * .55} ${x + r * 1.7} ${y - r * .1}" fill="none" stroke="${C.cream}" stroke-width="6" transform="rotate(-18 ${x} ${y})" opacity=".0"/>` : ''}</g>`;
  return `<g filter="url(#crayon)" opacity=".74">
    <ellipse cx="540" cy="250" rx="500" ry="120" fill="none" stroke="${C.cream}" stroke-width="3" stroke-dasharray="3 12" opacity=".5" stroke-linecap="round"/>
    <ellipse cx="540" cy="230" rx="440" ry="170" fill="none" stroke="${C.peach}" stroke-width="3" stroke-dasharray="3 12" opacity=".4" transform="rotate(14 540 230)" stroke-linecap="round"/>
    ${planet(210, 190, 88, C.orange, C.yellow, true)}${planet(640, 120, 52, C.sky, C.cream, false)}${planet(900, 250, 68, C.peach, C.orange, true)}
    ${K.dot(420, 330, 14, C.yellow)}${K.dot(760, 340, 10, C.cream)}${K.dot(120, 330, 9, C.pink)}${K.star4(500, 90, 22, C.yellow, .2)}${K.star4(1000, 120, 16, C.cream, .2)}${K.star4(350, 140, 12, C.peach, .2)}
    ${K.wisp(-20, 400, 1.3, .7, C.dust, .4)}${K.wisp(560, 430, 1.1, .6, C.blue, .45)}</g>`;
}
function fgContent() {
  K.reseed(21);
  const floor = `<g filter="url(#crayon)">${K.harlequin(SW, 100, 64, C.ink, C.blue).replace('<rect', '<rect transform="translate(0,466)"').replace(/<path /g, '<path transform="translate(0,466)" ')}<rect y="460" width="${SW}" height="12" fill="${C.dust}"/></g>`;
  const pillars = [...Array(6)].map((_, k) => { const x = 300 * k; return `<g filter="url(#crayon)"><rect x="${x - 15}" y="110" width="30" height="356" fill="${C.ink}"/><rect x="${x - 11}" y="114" width="22" height="80" fill="${C.blue}"/><rect x="${x - 11}" y="198" width="22" height="80" fill="${C.orange}"/><rect x="${x - 11}" y="282" width="22" height="80" fill="${C.yellow}"/><rect x="${x - 11}" y="366" width="22" height="96" fill="${C.sky}"/>${K.star4(x, 96, 26, C.yellow, .22)}</g>`; }).join('');
  const lanterns = [75, 225, 375, 525, 675, 825, 975, 1125, 1275, 1425, 1575, 1725].map((x, i) => `<path d="M${x} 0V${50 + (i % 3) * 22}" stroke="${C.cream}" stroke-width="2.5" opacity=".7"/>${K.star4(x, 62 + (i % 3) * 22, 11 + (i % 2) * 4, [C.yellow, C.peach, C.orange][i % 3], .22)}`).join('');
  const st = k => {
    const cx = XK(k), nm = `${k + 1} · ${N.stage(k + 1)}`;
    const art = [
      `<rect x="${cx - 16}" y="360" width="32" height="104" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/><ellipse cx="${cx}" cy="352" rx="104" ry="26" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/><ellipse cx="${cx}" cy="352" rx="82" ry="19" fill="${C.navy}"/>
       <path d="M${cx - 52} 346L${cx - 12} 336L${cx + 26} 350L${cx + 58} 334" fill="none" stroke="${C.orange}" stroke-width="4" stroke-linejoin="round"/>${[[-52, 346], [-12, 336], [26, 350], [58, 334]].map(([dx, dy]) => K.star4(cx + dx, dy, 11, C.yellow, .22)).join('')}${K.star4(cx, 274, 34, C.yellow, .2, `stroke="${C.ink}" stroke-width="3"`)}${K.dot(cx, 274, 6, C.cream)}`,
      `<rect x="${cx - 100}" y="250" width="60" height="214" fill="${C.navy}" stroke="${C.cream}" stroke-width="4"/><rect x="${cx + 40}" y="250" width="60" height="214" fill="${C.navy}" stroke="${C.cream}" stroke-width="4"/>${K.diamond(cx - 70, 305, 40, 46, C.orange, `stroke="${C.ink}" stroke-width="3"`)}${K.diamond(cx - 70, 380, 40, 46, C.yellow, `stroke="${C.ink}" stroke-width="3"`)}${K.diamond(cx + 70, 305, 40, 46, C.sky, `stroke="${C.ink}" stroke-width="3"`)}${K.diamond(cx + 70, 380, 40, 46, C.pink, `stroke="${C.ink}" stroke-width="3"`)}<path d="M${cx} 250V464" stroke="${C.cream}" stroke-width="3" stroke-dasharray="4 9"/>${K.star4(cx, 270, 22, C.yellow, .22)}`,
      `<path d="M${cx - 56} 464L${cx - 6} 372M${cx + 56} 464L${cx + 6} 372M${cx} 464V376" stroke="${C.cream}" stroke-width="6" stroke-linecap="round"/><ellipse cx="${cx}" cy="318" rx="100" ry="30" fill="none" stroke="${C.orange}" stroke-width="9" transform="rotate(-20 ${cx} 318)"/><ellipse cx="${cx}" cy="318" rx="76" ry="26" fill="none" stroke="${C.sky}" stroke-width="9" transform="rotate(28 ${cx} 318)"/><ellipse cx="${cx}" cy="318" rx="54" ry="20" fill="none" stroke="${C.yellow}" stroke-width="9" transform="rotate(-72 ${cx} 318)"/>${K.star4(cx, 318, 30, C.cream, .22, `stroke="${C.ink}" stroke-width="3"`)}${K.dot(cx, 318, 8, C.orange)}`,
      `<path d="M${cx - 104} 464L${cx - 86} 376H${cx + 86}L${cx + 104} 464z" fill="${C.ink}" stroke="${C.cream}" stroke-width="4"/><rect x="${cx - 96}" y="362" width="192" height="22" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/>${[-40, 12].map(d => `<circle cx="${cx + d}" cy="344" r="24" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/><path d="M${cx + d} 344L${cx + d + 11} 330" stroke="${C.orange}" stroke-width="5" stroke-linecap="round"/>`).join('')}<rect x="${cx + 62}" y="314" width="12" height="52" rx="5" fill="${C.orange}" stroke="${C.ink}" stroke-width="3" transform="rotate(14 ${cx + 68} 366)"/><path d="M${cx - 74} 300q40 -50 80 0z" fill="${C.sky}" stroke="${C.ink}" stroke-width="4"/><path d="M${cx - 34} 300V330" stroke="${C.cream}" stroke-width="4"/>${K.star4(cx - 34, 270, 14, C.yellow, .22)}`,
      `<rect x="${cx - 14}" y="400" width="28" height="64" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/><rect x="${cx - 88}" y="250" width="176" height="150" rx="16" fill="${C.navy}" stroke="${C.cream}" stroke-width="5"/>${[[-40, 296, C.orange], [40, 296, C.yellow], [-40, 356, C.sky], [40, 356, C.pink]].map(([dx, dy, c]) => `<circle cx="${cx + dx}" cy="${dy}" r="22" fill="${c}" stroke="${C.ink}" stroke-width="4"/>`).join('')}${K.star4(cx, 230, 16, C.yellow, .22)}`,
      `<rect x="${cx - 14}" y="392" width="28" height="72" fill="${C.cream}" stroke="${C.ink}" stroke-width="4"/><path d="M${cx - 96} 396L${cx - 74} 340H${cx + 74}L${cx + 96} 396z" fill="${C.ink}" stroke="${C.cream}" stroke-width="4"/><rect x="${cx - 78}" y="286" width="156" height="60" rx="10" fill="#efe0b4" stroke="${C.ink}" stroke-width="4"/><circle cx="${cx - 80}" cy="316" r="14" fill="${C.orange}" stroke="${C.ink}" stroke-width="3"/><circle cx="${cx + 80}" cy="316" r="14" fill="${C.orange}" stroke="${C.ink}" stroke-width="3"/>${K.star4(cx - 40, 316, 12, C.orange, .22)}${K.dot(cx, 316, 9, C.sky)}${K.diamond(cx + 40, 316, 20, 24, C.yellow, `stroke="${C.ink}" stroke-width="2.5"`)}${[-118, 118].map(d => `<rect x="${cx + d - 8}" y="410" width="16" height="54" fill="${C.cream}" stroke="${C.ink}" stroke-width="3"/>${K.star4(cx + d, 394, 14, C.yellow, .22)}`).join('')}`,
    ][k];
    return `<g class="st st${k}">
      <circle class="halo" cx="${cx}" cy="340" r="170" fill="url(#haloG)"/>
      <ellipse class="glow" cx="${cx}" cy="466" rx="130" ry="20" fill="none" stroke="${C.yellow}" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/>

      ${K.star4(480, 250, 200, C.cream, .11)}${K.dot(480, 250, 66, C.orange)}${K.dot(480, 250, 46, C.yellow)}${K.star4(480, 250, 90, '#fff7d8', .2)}${K.scatter(24, 960, 520, [C.orange, C.peach, C.yellow], 4, 12)}${K.scatter(8, 960, 480, [C.cream, C.yellow], 9, 20, 'star')}
      <path d="M0 430C100 396 200 410 300 430C400 396 560 400 660 428C780 400 880 410 960 430V600H0z" fill="${C.cream}"/></g></svg>`;
  return `<svg viewBox="0 0 960 600" preserveAspectRatio="xMidYMid slice"><g filter="url(#crayon)"><rect width="960" height="600" fill="${won ? C.sky : C.navy}"/><rect width="960" height="280" fill="${won ? C.blue : C.ink}"/><rect y="400" width="960" height="200" fill="${won ? C.peach : C.blue}"/>
      <circle cx="480" cy="300" r="170" fill="none" stroke="${C.orange}" stroke-width="10"/><circle cx="480" cy="300" r="128" fill="${won ? C.yellow : C.peach}"/>${K.star4(480, 300, 260, C.cream, .08)}${K.scatter(20, 960, 300, [C.cream, C.peach], 3, 9)}${K.cloud(-40, 380, 1.5, C.cream)}${K.cloud(560, 400, 1.4, C.cream)}</g></svg>`;
}
function renderLobby() {
  const s = S; $('#lobby').innerHTML = `${wideArt('home')}<div class="center"><div style="font-size:60px;line-height:1.1;font-weight:900;color:var(--navy)">${L('星门', 'GATE')}</div><div style="letter-spacing:7px;font-weight:700;color:var(--ink);font-size:14px;margin-bottom:12px">${L('星象师 · STARGAZER', 'GATE OF STARS · STARGAZER')}</div>
    <p style="margin:4px auto;max-width:520px;font-weight:700;color:var(--ink);font-size:14px;line-height:1.7">${L('你站在环绕自己的星环中间，看不见旅人，却读得懂星图。拖拽转身，走向亮起的台子。', 'You stand inside a ring of orbits. You cannot see the Wanderer, but you can read the stars. Drag to turn; head for the console that glows.')}</p>
    <button class="btn" id="rdy" ${s.ready.hq ? 'disabled' : ''}>${s.ready.hq ? L('已准备', 'READY ✓') : L('准备好了', 'READY')}</button>
    <div class="stat"><i class="${s.present.phone ? 'on' : ''}"></i>${s.present.phone ? L('旅人已连线', 'Wanderer connected') : L('等待旅人连线…', 'Waiting for the Wanderer…')} ${s.ready.phone ? L('· 已准备', '· ready') : ''}</div></div>`;
  $('#rdy').onclick = async () => { SFX.unlock(); SFX.click(); NET.act('ready'); };
}
function renderEnd() {
  const s = S, won = s.phase === 'won', why = { alarm: L('警报响彻了星门。', 'The alarms woke the gate.'), time: L('黎明已至，星门未开。', 'Dawn came before the gate opened.') }[s.why] || '';
  $('#end').innerHTML = `${wideArt(won ? 'won' : 'lost')}<div class="center"><div style="font-size:64px;line-height:1.1;font-weight:900;color:var(--navy)">${won ? L('黎明', 'DAWN') : L('天亮了', 'TOO LATE')}</div>
    <div style="background:var(--cream);color:var(--ink);display:inline-flex;gap:30px;border-radius:18px;padding:12px 26px;font-weight:800;margin:10px 0 0">${won ? `<span><small>${L('用时', 'TIME')}</small><br><b style="font-size:24px;color:var(--navy)">${fmt(s.endAt - s.startAt)}</b></span><span><small>${L('警报', 'ALARMS')}</small><br><b style="font-size:24px;color:var(--orange)">${s.alarm}</b></span>` : `<span style="font-size:15px">${why}</span>`}</div><br><button class="btn" id="again">${L('再来一局 · AGAIN', 'PLAY AGAIN')}</button></div>`;
  $('#again').onclick = () => NET.act('reset');
}

// ======================= 事件提示（互相切换星灯 / 星令 / 祭仪）=======================
function toast(msg, ms = 2800) { const e = $('#toast'); e.textContent = msg; e.classList.add('on'); clearTimeout(ui.tt); ui.tt = setTimeout(() => e.classList.remove('on'), ms); }
const evQ = []; let evBusy = false;   // 事件提示排队：同一刻来几条就依次显示
function toastEv(m) { if (evQ.length < 4) evQ.push(m); if (!evBusy) nextEv(); }
function nextEv() { const m = evQ.shift(); if (!m) { evBusy = false; return; } evBusy = true; toast(m, 1900); setTimeout(nextEv, 1950); }
function handleEvents(s) {
  if (ui.seenT === null || ui.seenT === undefined) { ui.seenT = s.events.length ? s.events[s.events.length - 1].t : 0; return; }
  const fresh = s.events.filter(e => e.t > ui.seenT);
  for (const e of fresh) {
    if (e.k === 'toggle' && e.p.side === 'phone') { toastEv(EV.toggle(e.p)); SFX.pitch(e.p.idx + 2); }
    else if (e.k === 'orderOK') { toastEv(EV.orderOK(e.p)); SFX.ok(); }
    else if (e.k === 'orderNew' && e.p.who === 'hq') { toastEv(EV.orderNew(e.p)); SFX.tick(); }
    else if (e.k === 'ritOK') { toastEv(EV.ritOK()); SFX.ok(); }
    else if (e.k === 'ritNoChant') { toastEv(EV.ritNoChant()); SFX.bad(); }
    else if (e.k === 'ritWeak') toastEv(EV.ritWeak());
  }
  if (fresh.length) ui.seenT = fresh[fresh.length - 1].t;
}

// ======================= 状态渲染 =======================
function render(s) {
  const prevStage = ui.lastStage; S = s; const playing = s.phase === 'playing', over = s.phase === 'won' || s.phase === 'lost';
  $('#lobby').hidden = s.phase !== 'lobby'; if (s.phase === 'lobby') renderLobby();
  $('#end').hidden = !over; if (over) { renderEnd(); closeFocus(); }
  renderHUD(); refreshStations(); tickTimer(); handleEvents(s);
  if (s.phase === 'playing' && s.startAt) { try { const key = 'intro:' + s.startAt; if (!sessionStorage.getItem(key)) { if (NET.now() >= s.startAt) sessionStorage.setItem(key, '1'); else if (!ui.introEl) { ui.introEl = KIT.intro('hq', () => { try { sessionStorage.setItem(key, '1'); } catch (_) {} ui.introEl = null; }); } } } catch (_) {} }
  MUSIC.setMood((s.alarm >= cfg.maxAlarm - 1 || (s.phase === 'playing' && s.stage === 4 && s.nextHit - NET.now() > 0 && s.nextHit - NET.now() <= cfg.stormWarn)) ? 'tense' : 'calm');
  if (s.alarm > ui.lastAlarm) { SFX.bad(); document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); } ui.lastAlarm = s.alarm;
  if (s.phase === 'lobby' && ui.lastPhase && ui.lastPhase !== 'lobby') { closeFocus(); ui.lastStage = -1; ui.lastAlarm = 0; }
  if (playing && s.stage !== prevStage) { ui.lastStage = s.stage; if (prevStage > 0) { SFX.ok(); closeFocus(); closeBook(); } }
  if (!playing) ui.lastStage = -1;
  if (ui.focus !== null) updateFocus();
  ui.lastPhase = s.phase;
}
(async () => {
  K.install(); cfg = await NET.init('hq'); buildLayers(); applyX(); loop();
  NET.onConn(on => $('#conn').classList.toggle('on', on)); NET.onState(render);
  MUSIC.role('hq'); const syncMus = () => $('#mus').classList.toggle('off', MUSIC.muted); syncMus(); $('#mus').onclick = () => { SFX.unlock(); MUSIC.toggle(); syncMus(); };
  $('#lang').onclick = () => LANG.toggle();
  document.addEventListener('langchange', () => { buildLayers(); if (S) { render(S); if (ui.focus !== null) { const k = ui.focus; closeFocus(); openFocus(k); } if (!$('#book').hidden) openBook(ui.tab); } });
  window.addEventListener('resize', applyX); ui.x = XK(0) - pano.clientWidth / 2;
  setInterval(tickTimer, 200);
  { const q = new URLSearchParams(location.search); if (q.get('focus')) setTimeout(() => openFocus(+q.get('focus')), 900); }   // 截图用：?focus=3
})();
</script>
